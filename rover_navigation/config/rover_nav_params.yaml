---
/**:
  ### NAVIGATION ###
  bt_navigator:
    ros__parameters:
      use_sim_time: false
      global_frame: <global_frame>
      robot_base_frame: <namespace>/base_link
      odom_topic: odom

      # Extra BT leaf plugins, on top of the ones nav2_bt_navigator loads from its built-in
      # list (nav2_behavior_tree/plugins_list.hpp). This list is *additional*; do not repeat
      # the built-ins here or the factory will try to register them twice.
      plugin_lib_names:
        - is_motion_locked_bt_node
        - is_lidar_healthy_bt_node

  bt_navigator_navigate_through_poses_rclcpp_node:
    ros__parameters:
      use_sim_time: false

  bt_navigator_navigate_to_pose_rclcpp_node:
    ros__parameters:
      use_sim_time: false

  controller_server:
    ros__parameters:
      use_sim_time: false
      enable_stamped_cmd_vel: true

      controller_frequency: 10.0
      odom_topic: odom
      costmap_update_timeout: 0.5

      min_x_velocity_threshold: 0.01
      min_y_velocity_threshold: 0.01
      min_theta_velocity_threshold: 0.05
      failure_tolerance: 0.4
      use_realtime_priority: false

      # Progress checker parameters
      progress_checker_plugin: progress_checker
      progress_checker:
        movement_time_allowance: 10.0
        plugin: nav2_controller::SimpleProgressChecker
        required_movement_radius: 0.5

      # Goal checker parameters
      goal_checker_plugins: [goal_checker]
      goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        stateful: true
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.15

      # MPPI controller
      controller_plugins: [FollowPath]
      FollowPath:
        plugin: nav2_mppi_controller::MPPIController
        time_steps: 40
        model_dt: 0.1
        batch_size: 800
        vx_std: 0.4
        vy_std: 0.0
        wz_std: 0.5
        vx_max: 0.8
        vx_min: -0.5
        vy_max: 0.0
        wz_max: 1.0
        # Must stay consistent with velocity_smoother max_accel / max_decel below,
        # otherwise MPPI plans stops the hardware cannot execute and overshoots.
        ax_max: 1.5
        ax_min: -1.5
        ay_max: 0.0
        az_max: 2.0
        iteration_count: 1
        prune_distance: 2.5
        transform_tolerance: 0.1
        temperature: 0.3
        gamma: 0.015
        # Nav 2 1.5.x: motion_model names a plugin *namespace*, not an enum value.
        # Optimizer::setMotionModel() resolves <controller>.<motion_model>.plugin via
        # get_plugin_type_param(), which throws if the block below is missing.
        motion_model: DiffDrive
        DiffDrive:
          plugin: mppi::DiffDriveMotionModel
        regenerate_noises: true
        visualize: false
        AckermannConstraints:
          min_turning_r: 0.05
        critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
        ConstraintCritic:
          # Keeps MPPI inside its own declared vx_max / wz_max box; nothing else does.
          enabled: true
          cost_power: 1
          cost_weight: 4.0
        GoalCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          threshold_to_consider: 3.2
        GoalAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.0
          threshold_to_consider: 0.1
        PreferForwardCritic:
          enabled: true
          cost_power: 1
          cost_weight: 7.0
          threshold_to_consider: 1.5
        CostCritic:
          enabled: true
          cost_power: 1
          cost_weight: 3.81
          critical_cost: 300.0
          # Full-footprint collision checking, enabled now that rover_rs16_lidar marks the
          # costmap. The footprint sweep over 800x40 trajectory points is the dominant cost
          # in the control loop: if `ros2 topic hz <ns>/nav_cmd_vel_stamped` drops below the
          # 10 Hz controller_frequency on the orchestrator computer, set this back to false
          # and accept point-check collision detection instead.
          consider_footprint: true
          collision_cost: 1000000.0
          near_goal_distance: 1.0
        PathAlignCritic:
          enabled: true
          cost_power: 1
          cost_weight: 14.0
          max_path_occupancy_ratio: 0.05
          trajectory_point_step: 4
          threshold_to_consider: 0.5
          offset_from_furthest: 20
          use_path_orientations: false
        PathFollowCritic:
          enabled: true
          cost_power: 1
          cost_weight: 5.0
          offset_from_furthest: 5
          threshold_to_consider: 3.2
        PathAngleCritic:
          enabled: true
          cost_power: 1
          cost_weight: 2.0
          offset_from_furthest: 4
          threshold_to_consider: 0.5
          max_angle_to_furthest: 1.0
          mode: 0
        # TwirlingCritic:
        #   enabled: true
        #   twirling_cost_power: 1
        #   twirling_cost_weight: 10.0

  # Self-filter for the pointcloud path. Only launched when observation_topic_type:=pointcloud
  # (see bringup.launch.py); the default laserscan path does not use it, because STVL's
  # update_footprint_enabled already clears the footprint out of <ns>/scan.
  #
  # The crop box is the robot's own bounding box, substituted from the same <min_x>..<max_z>
  # tokens as the Nav 2 footprint, so the two can never drift apart. `negative: false` keeps
  # everything *outside* the box.
  pointcloud_crop_box:
    ros__parameters:
      input_topic: <observation_topic>
      output_topic: <observation_topic>_filtered
      target_frame: <namespace>/base_link
      message_type: pointcloud
      negative: false
      visualize_crop_boxes: true
      crop_boxes_names: [robot_box]
      crop_boxes:
        robot_box:
          min_x: <min_x>
          max_x: <max_x>
          min_y: <min_y>
          max_y: <max_y>
          min_z: <min_z>
          max_z: <max_z>

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: false

        global_frame: <namespace>/odom
        robot_base_frame: <namespace>/base_link
        transform_tolerance: 0.1

        update_frequency: 5.0
        publish_frequency: 2.0

        width: 8
        height: 8
        # 0.05 keeps the 8 x 8 m window at 160x160 cells. At 0.02 it was 400x400, which
        # the 10 Hz control loop could not sustain (observed 5.2 Hz).
        resolution: 0.05

        always_send_full_costmap: true
        rolling_window: true

        footprint: '[[<min_x>, <min_y>], [<min_x>, <max_y>], [<max_x>, <max_y>], [<max_x>, <min_y>]]'

        plugins: [stvl_layer, inflation_layer]
        stvl_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
          enabled: true
          voxel_decay: 1.0
          decay_model: 0
          voxel_size: 0.05
          track_unknown_space: true
          unknown_threshold: 15
          mark_threshold: 0
          # Clears the rover's own returns out of the footprint. rover_rs16_lidar's scan projection
          # applies no self-filter, and the RS16's 360 deg x +/-15 deg field sees the rover
          # body, so this is what keeps the footprint from becoming a permanent obstacle ring.
          update_footprint_enabled: true
          combination_method: 1
          origin_z: 0.0
          publish_voxel_map: true
          transform_tolerance: 0.2
          mapping_mode: false
          map_save_duration: 60.0
          # Resolves to `laserscan` or `pointcloud`, which selects the matching block below.
          observation_sources: <observation_topic_type>
          # Fed by pointcloud_crop_box, which self-filters <ns>/rslidar_points. Only runs
          # when observation_topic_type:=pointcloud; pass observation_topic:=rslidar_points.
          pointcloud:
            data_type: PointCloud2
            topic: <observation_topic>_filtered
            marking: true
            clearing: true
            obstacle_range: 3.0
            min_obstacle_height: 0.0
            max_obstacle_height: 2.0
            expected_update_rate: 0.5
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 2
            clear_after_reading: true
            max_z: 2.0
            min_z: -0.5
            # RS16 geometry: +/-15 deg vertical, 360 deg horizontal.
            vertical_fov_angle: 0.524
            horizontal_fov_angle: 6.2832
            decay_acceleration: 15.0
            model_type: 0
          # The default path: <ns>/scan, projected from the RS16 cloud by rover_rs16_lidar.
          laserscan:
            data_type: LaserScan
            topic: <observation_topic>
            marking: true
            clearing: true
            obstacle_range: 3.0
            min_obstacle_height: 0.0
            max_obstacle_height: 2.0
            # rover_rs16_lidar runs at 10 Hz; makes STVL complain when the scan stops.
            expected_update_rate: 0.5
            observation_persistence: 0.0
            # rover_rs16_lidar sets scan.use_inf: true, so no-return beams arrive as +inf.
            # Discarding them would stop STVL clearing free space along an empty ray.
            inf_is_valid: true
            filter: "voxel"
            # A flattened single-ring scan leaves ~1 point per voxel, so 2 would drop the
            # whole scan.
            voxel_min_points: 1
            clear_after_reading: true
            # min_z/max_z are in the global frame, not the sensor frame. lidar_link sits at
            # ROVER_LIDAR_LOCALIZATION_Z above body_link (default 0.0), so a scan ring lands
            # near z=0 and the upstream default of 0.1 filtered out every single point.
            max_z: 2.0
            min_z: -0.5
            # RS16 geometry: +/-15 deg vertical, 360 deg horizontal.
            vertical_fov_angle: 0.524
            horizontal_fov_angle: 6.2832
            decay_acceleration: 15.0
            model_type: 0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 2.0
          # Sized to the robot: footprint is 0.98 x 0.98 m, circumscribed radius 0.693 m.
          inflation_radius: 0.9


  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: false

        global_frame: <global_frame>
        robot_base_frame: <namespace>/base_link
        transform_tolerance: 0.1

        update_frequency: 1.0
        publish_frequency: 1.0

        resolution: 0.05

        always_send_full_costmap: true
        track_unknown_space: true # if false, treats unknown space as free space, else as unknown space

        footprint: '[[<min_x>, <min_y>], [<min_x>, <max_y>], [<max_x>, <max_y>], [<max_x>, <min_y>]]'

        plugins: [static_layer, stvl_layer, inflation_layer]
        stvl_layer:
          plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
          enabled: true
          voxel_decay: 1.0
          decay_model: 0
          voxel_size: 0.05
          track_unknown_space: true
          unknown_threshold: 15
          mark_threshold: 0
          # Clears the rover's own returns out of the footprint. rover_rs16_lidar's scan projection
          # applies no self-filter, and the RS16's 360 deg x +/-15 deg field sees the rover
          # body, so this is what keeps the footprint from becoming a permanent obstacle ring.
          update_footprint_enabled: true
          combination_method: 1
          origin_z: 0.0
          publish_voxel_map: true
          transform_tolerance: 0.2
          mapping_mode: false
          map_save_duration: 60.0
          # Resolves to `laserscan` or `pointcloud`, which selects the matching block below.
          observation_sources: <observation_topic_type>
          # Fed by pointcloud_crop_box, which self-filters <ns>/rslidar_points. Only runs
          # when observation_topic_type:=pointcloud; pass observation_topic:=rslidar_points.
          pointcloud:
            data_type: PointCloud2
            topic: <observation_topic>_filtered
            marking: true
            clearing: true
            obstacle_range: 8.0
            min_obstacle_height: 0.0
            max_obstacle_height: 2.0
            expected_update_rate: 0.5
            observation_persistence: 0.0
            inf_is_valid: false
            filter: "voxel"
            voxel_min_points: 2
            clear_after_reading: true
            max_z: 2.0
            min_z: -0.5
            # RS16 geometry: +/-15 deg vertical, 360 deg horizontal.
            vertical_fov_angle: 0.524
            horizontal_fov_angle: 6.2832
            decay_acceleration: 15.0
            model_type: 0
          # The default path: <ns>/scan, projected from the RS16 cloud by rover_rs16_lidar.
          laserscan:
            data_type: LaserScan
            topic: <observation_topic>
            marking: true
            clearing: true
            obstacle_range: 8.0
            min_obstacle_height: 0.0
            max_obstacle_height: 2.0
            # rover_rs16_lidar runs at 10 Hz; makes STVL complain when the scan stops.
            expected_update_rate: 0.5
            observation_persistence: 0.0
            # rover_rs16_lidar sets scan.use_inf: true, so no-return beams arrive as +inf.
            # Discarding them would stop STVL clearing free space along an empty ray.
            inf_is_valid: true
            filter: "voxel"
            # A flattened single-ring scan leaves ~1 point per voxel, so 2 would drop the
            # whole scan.
            voxel_min_points: 1
            clear_after_reading: true
            # min_z/max_z are in the global frame, not the sensor frame. lidar_link sits at
            # ROVER_LIDAR_LOCALIZATION_Z above body_link (default 0.0), so a scan ring lands
            # near z=0 and the upstream default of 0.1 filtered out every single point.
            max_z: 2.0
            min_z: -0.5
            # RS16 geometry: +/-15 deg vertical, 360 deg horizontal.
            vertical_fov_angle: 0.524
            horizontal_fov_angle: 6.2832
            decay_acceleration: 15.0
            model_type: 0
        inflation_layer:
          plugin: nav2_costmap_2d::InflationLayer
          cost_scaling_factor: 1.5
          # Sized to the robot: footprint is 0.98 x 0.98 m, circumscribed radius 0.693 m.
          inflation_radius: 0.9
          inflate_around_unknown: false
          inflate_unknown: false
        static_layer:
          plugin: nav2_costmap_2d::StaticLayer
          map_subscribe_transient_local: true
          map_topic: /<namespace>/map


  planner_server:
    ros__parameters:
      use_sim_time: false
      expected_planner_frequency: 1.0

      planner_plugins: [GridBased]
      GridBased:
        plugin: nav2_smac_planner::SmacPlanner2D
        tolerance: 0.125 # tolerance for planning if unable to reach exact pose, in meters
        downsample_costmap: false # whether or not to downsample the map
        downsampling_factor: 1 # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
        allow_unknown: true # allow traveling in unknown space
        max_iterations: 600000 # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
        max_on_approach_iterations: 500 # maximum number of iterations to attempt to reach goal once in tolerance
        max_planning_time: 3.0 # max time in s for planner to plan, smooth
        cost_travel_multiplier: 2.5 # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
        use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
        smoother:
          max_iterations: 500
          w_smooth: 0.2
          w_data: 0.2
          tolerance: 1.0e-6

  behavior_server:
    ros__parameters:
      use_sim_time: false
      enable_stamped_cmd_vel: true

      global_frame: <global_frame>
      local_frame: <namespace>/odom
      robot_base_frame: <namespace>/base_link
      transform_tolerance: 0.1

      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      cycle_frequency: 10.0

      recovery_plugins: [spin, backup, wait]
      spin:
        plugin: nav2_behaviors::Spin
      backup:
        plugin: nav2_behaviors::BackUp
      wait:
        plugin: nav2_behaviors::Wait

      # spin & backup
      simulate_ahead_time: 2.0

      # spin
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2

  waypoint_follower:
    ros__parameters:
      use_sim_time: false
      enable_stamped_cmd_vel: true
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: wait_at_waypoint
      wait_at_waypoint:
        plugin: nav2_waypoint_follower::WaitAtWaypoint
        waypoint_pause_duration: 5

  velocity_smoother:
    ros__parameters:
      use_sim_time: false
      enable_stamped_cmd_vel: true
      smoothing_frequency: 20.0
      scale_velocities: False
      feedback: OPEN_LOOP
      max_velocity: [0.8, 0.0, 1.0]
      min_velocity: [-0.5, 0.0, -1.0]
      max_accel: [1.5, 0.0, 2.0]
      max_decel: [-1.5, 0.0, -2.0]
      odom_topic: <namespace>/odom
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0

  ### LOCALIZATION ###

  # Only used when bringup.launch.py is started with localization_source:=amcl. AMCL then
  # owns <namespace>/map -> <namespace>/odom, so ROVER_USE_GPS must be off (or
  # ROVER_GPS_PUBLISH_MAP_TF=false) and slam_toolbox must not run: all three publish that
  # same transform, and two owners fight rather than error.
  amcl:
    ros__parameters:
      use_sim_time: false

      global_frame_id: <namespace>/map
      odom_frame_id: <namespace>/odom
      # base_link, not the EKF's base_footprint child: it matches every costmap's
      # robot_base_frame and bt_navigator's. The URDF joint between them is a pure +Z
      # offset with no rotation (rover_description base.urdf.xacro), so the planar
      # odom -> base delta AMCL integrates -- and the map -> odom it emits -- are identical
      # either way.
      base_frame_id: <namespace>/base_link

      scan_topic: <scan_topic>
      # Relative on purpose: resolves to /<namespace>/map inside the pushed namespace, the
      # same latched topic global_costmap's static_layer subscribes to.
      map_topic: map
      # false: in localization_source:=indoor, rover_indoor_nav_manager switches saved maps by
      # asking map_server to load another one, which republishes `map`; with true AMCL would
      # keep localizing on the old map. With amcl the map is never republished, so this costs
      # nothing there. A new map only replaces AMCL's map; the manager re-seeds the pose.
      first_map_only: false

      robot_model_type: nav2_amcl::DifferentialMotionModel

      # Seeded from a known pose rather than scattering particles over the map:
      # reinitialize_global_localization converges slowly and, in corridors and repeated
      # bays, can settle into the wrong self-similar hypothesis. initial_pose is overridden
      # per site by localization.launch.py from ROVER_AMCL_INITIAL_POSE_{X,Y,YAW}; the 0,0,0
      # below is correct only when the map origin is where the rover parks.
      set_initial_pose: true
      # Every activation re-seeds from initial_pose instead of the last estimate, so startup
      # is deterministic: the rover comes up believing it is where it physically is. This
      # makes save_pose_rate pointless -- AMCL would write its estimate back into its own
      # parameters only for this to discard it -- so the writeback is disabled below.
      always_reset_initial_pose: true
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0

      tf_broadcast: true
      transform_tolerance: 1.0

      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2

      # Beam skipping - ignores beams for which a majoirty of particles do not agree with the map
      # prevents correct particles from getting down weighted because of unexpected obstacles
      # such as humans
      do_beamskip: false
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3

      lambda_short: 0.1

      laser_model_type: likelihood_field
      laser_likelihood_max_dist: 2.0
      # Matches rover_rs16_lidar's scan.range_max (20.0 m).
      laser_max_range: 20.0
      laser_min_range: -1.0

      max_beams: 60

      max_particles: 2000
      min_particles: 500

      pf_err: 0.05
      pf_z: 0.99

      # Augmented-MCL random-particle injection, disabled. With a known startup prior it
      # mostly hurts: in feature-poor corridors it degrades an already-converged estimate.
      # 0.001 / 0.1 is the standard pair if automatic kidnap recovery is ever wanted; the
      # manual path is amcl/set_initial_pose (see rover_navigation/README.md).
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0

      resample_interval: 1
      # Disabled: see always_reset_initial_pose. Nothing reads what this would write --
      # AMCL only set_parameters() on itself, it never persists to disk, so a restart
      # always comes back from the YAML value regardless.
      save_pose_rate: -1.0
      sigma_hit: 0.2

      update_min_a: 0.1
      update_min_d: 0.15

      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05

  ### MAP SERVER ###

  map_server:
    ros__parameters:
      use_sim_time: false
      yaml_filename: empty_world.yaml
      frame_id: <namespace>/map

  map_autosaver:
    ros__parameters:
      use_sim_time: false
      autosave_period: 15.0
      # map_directory is deliberately not set in this file. Despite its name it is a file
      # prefix: every autosave writes <map_directory>.yaml and <map_directory>.pgm.
      # bringup.launch.py sets it to <maps_dir>/map (maps_dir defaults to /maps), so the
      # SLAM result lands in the same maps volume rover_indoor_nav_manager uses. It is only
      # written here, never loaded automatically: to navigate on it, start bringup with
      # localization_source:=amcl map:=<maps_dir>/map.yaml. Run without bringup, the node
      # falls back to its built-in default, /maps/map.

  ### SLAM ###
  # Only used when bringup.launch.py is started with localization_source:=slam. slam_toolbox
  # then owns <namespace>/map -> <namespace>/odom, so ROVER_USE_GPS must be off: the
  # global EKF (rover_ekf_global_node) publishes the same transform.

  map_saver:
    ros__parameters:
      use_sim_time: false
      save_map_timeout: 5.0
      free_thresh_default: 0.25
      occupied_thresh_default: 0.65
      map_subscribe_transient_local: true

  <namespace>/slam_toolbox:
    ros__parameters:
      use_sim_time: false

      # Plugin params
      solver_plugin: solver_plugins::CeresSolver
      ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
      ceres_preconditioner: SCHUR_JACOBI
      ceres_trust_strategy: LEVENBERG_MARQUARDT
      ceres_dogleg_type: TRADITIONAL_DOGLEG
      ceres_loss_function: None

      # ROS Parameters
      odom_frame: <namespace>/odom
      map_frame: <namespace>/map
      base_frame: <namespace>/base_link
      scan_topic: <scan_topic>
      mode: mapping

      debug_logging: false
      throttle_scans: 1
      transform_publish_period: 0.04
      map_update_interval: 1.0
      resolution: 0.05
      # Matches rover_rs16_lidar's scan.range_max (20.0 m).
      max_laser_range: 20.0
      minimum_time_interval: 0.05
      transform_timeout: 0.5
      tf_buffer_duration: 20.0
      stack_size_to_use: 40000000
      enable_interactive_mode: false

      # General Parameters
      use_scan_matching: true
      use_scan_barycenter: true
      minimum_travel_distance: 0.2
      minimum_travel_heading: 0.1
      scan_buffer_size: 10
      scan_buffer_maximum_scan_distance: 0.5
      link_match_minimum_response_fine: 0.1
      link_scan_maximum_distance: 0.75
      loop_search_maximum_distance: 3.0
      do_loop_closing: true
      loop_match_minimum_chain_size: 10
      loop_match_maximum_variance_coarse: 3.0
      loop_match_minimum_response_coarse: 0.35
      loop_match_minimum_response_fine: 0.45

      # Correlation Parameters
      correlation_search_space_dimension: 0.5
      correlation_search_space_resolution: 0.01
      correlation_search_space_smear_deviation: 0.1

      # Loop Closure Parameters
      loop_search_space_dimension: 8.0
      loop_search_space_resolution: 0.05
      loop_search_space_smear_deviation: 0.03

      # Scan Matcher Parameters
